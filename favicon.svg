<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="rk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620" />
      <stop offset="100%" stop-color="#0c0d11" />
    </linearGradient>
    <linearGradient id="rk-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#079ecc" />
    </linearGradient>
    <linearGradient id="rk-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#079ecc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#068595" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Container background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#rk-bg)" stroke="url(#rk-border)" stroke-width="2" />

  <!-- Keyboard base frame -->
  <rect x="10" y="14" width="44" height="36" rx="6" fill="#181c26" stroke="#252c3d" stroke-width="1.5" />

  <!-- Keycap Row 1 -->
  <rect x="14" y="18" width="6.5" height="6.5" rx="1.5" fill="#252d40" />
  <rect x="22.5" y="18" width="6.5" height="6.5" rx="1.5" fill="#252d40" />
  <rect x="31" y="18" width="6.5" height="6.5" rx="1.5" fill="#252d40" />
  <rect x="39.5" y="18" width="10.5" height="6.5" rx="1.5" fill="#252d40" />

  <!-- Keycap Row 2 (with Cyan active key) -->
  <rect x="14" y="26.5" width="8.5" height="6.5" rx="1.5" fill="#252d40" />
  <rect x="24.5" y="26.5" width="6.5" height="6.5" rx="1.5" fill="url(#rk-cyan)" />
  <rect x="33" y="26.5" width="6.5" height="6.5" rx="1.5" fill="#252d40" />
  <rect x="41.5" y="26.5" width="8.5" height="6.5" rx="1.5" fill="#252d40" />

  <!-- Keycap Row 3 (Spacebar & modifiers) -->
  <rect x="14" y="35" width="6.5" height="6.5" rx="1.5" fill="#252d40" />
  <rect x="22.5" y="35" width="19" height="6.5" rx="1.5" fill="#1f2636" stroke="#079ecc" stroke-width="1" />
  <!-- Caret line on spacebar -->
  <line x1="28" y1="38.25" x2="36" y2="38.25" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" />
  <rect x="43.5" y="35" width="6.5" height="6.5" rx="1.5" fill="#252d40" />
</svg>

