<!DOCTYPE html>
<html lang="en" data-theme="rapidkeys">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RapidKeys - Minimalist, focus-first typing speed web application featuring in-place typing, fluid caret dynamics, real-time telemetry, and precision scoring.">
    <meta name="theme-color" content="#0c0d11">

    <title>&lt;RapidKeys&gt; - Speed Typing</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <!-- Main Application Shell -->
    <div class="app-shell" id="appShell">
      <!-- Header with Brand Logo -->
      <header class="header" id="header">
        <h1 class="logo" id="heading">
          <span class="logo-bracket">&lt;</span>RapidKeys<span class="logo-bracket">&gt;</span>
        </h1>
      </header>

      <!-- Navigation & Configuration Control Bar Container -->
      <div id="navContainer" class="nav-container"></div>

      <!-- Live Countdown Timer & Word Target Counter HUD -->
      <div id="liveHud" class="live-hud" aria-live="polite">
        <span id="liveCounter" class="live-counter">30</span>
      </div>

      <!-- Main Interactive Viewport -->
      <main class="main-content" id="app">
        <!-- In-Place Typing Surface Mount -->
        <div id="typingArea" class="typing-area"></div>

        <!-- Dedicated Results Screen Mount -->
        <div id="resultsArea" class="results-area hidden"></div>
      </main>

      <!-- Out-of-Focus Blur Refocus Overlay Banner -->
      <div id="focusOverlay" class="focus-overlay hidden" role="alert">
        <div class="focus-notice">
          <span class="focus-icon" aria-hidden="true">⌨</span>
          <span class="focus-text">Click or press any key to focus</span>
        </div>
      </div>

      <!-- Command Palette / Theme Switcher Modal Container -->
      <div id="commandPalette" class="modal hidden command-palette" role="dialog" aria-modal="true" aria-label="Command Palette"></div>

      <!-- Footer with Keyboard Shortcut Hints -->
      <footer class="footer" id="footer">
        <div class="shortcut-hints">
          <span class="key-hint"><kbd>tab</kbd> + <kbd>enter</kbd> &mdash; restart test</span>
          <span class="key-hint"><kbd>esc</kbd> &mdash; command palette</span>
        </div>
        <div class="brand-credit">
          <span class="credit-brand">&lt;RapidKeys&gt;</span> &bull; Minimalist Speed Typing
        </div>
      </footer>
    </div>

    <!-- Modular Vanilla ES-Module Application Entry Point -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
